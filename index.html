<script>
/* ===================== القوائم الافتراضية ===================== */
const DEFAULT_LISTS = {
  names: [],
  types: ['فرمونية','ضوئية','لاصقة','مائية'],
  locations: [],
  species: ['سوسة النخيل الحمراء','دوباس النخيل','حفار ساق النخيل','ذبابة الفاكهة']
};
const LIST_TITLES = {names:'أسماء المصائد', types:'أنواع المصائد', locations:'المواقع', species:'أنواع الحشرات'};
function normLists(o){
  const out={};
  for(const k in DEFAULT_LISTS){
    const v = o && o[k];
    const arr = v ? Object.values(v).filter(x=>typeof x==='string' && x.trim()) : [];
    out[k] = arr.length ? arr : [...DEFAULT_LISTS[k]];
  }
  return out;
}

/* ===================== طبقة التخزين ===================== */
const useFirebase = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
let DB, auth = null, CUR = null, IS_ADMIN = false;
if (useFirebase) {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  const rdb = firebase.database();
  const toArr = o => o ? Object.entries(o).map(([k,v]) => ({...v, _id:k})) : [];
  DB = {
    async getTraps(){ const s = await rdb.ref('traps').once('value'); return toArr(s.val()).sort((a,b)=>a.code.localeCompare(b.code)); },
    async getTrap(c){ const s = await rdb.ref('traps/'+c).once('value'); return s.val(); },
    async saveTrap(t){ await rdb.ref('traps/'+t.code).set(t); },
    async deleteTrap(c){ await rdb.ref('traps/'+c).remove(); await rdb.ref('readings/'+c).remove(); },
    async getReadings(c){ const s = await rdb.ref('readings/'+c).once('value'); return toArr(s.val()).sort((a,b)=>b.ts-a.ts); },
    async addReading(c,r){ await rdb.ref('readings/'+c).push(r); },
    async addReadingKey(c,id,r){ await rdb.ref(`readings/${c}/${id}`).set(r); },
    async deleteReading(c,id){ await rdb.ref(`readings/${c}/${id}`).remove(); },
    async isAdmin(u){ try{ const s = await rdb.ref('admins/'+u).once('value'); return s.val()===true; }catch(e){ return false; } },
    async allReadings(){ const s = await rdb.ref('readings').once('value'); const o=s.val()||{}; let out=[]; for(const c in o) toArr(o[c]).forEach(r=>out.push({...r,code:c})); return out; },
    async getLists(){ try{ const s = await rdb.ref('lists').once('value'); return normLists(s.val()); }catch(e){ return normLists(null); } },
    async saveList(k,arr){ await rdb.ref('lists/'+k).set(arr); }
  };
} else {
  const L = k => JSON.parse(localStorage.getItem(k) || '{}');
  const S = (k,v) => localStorage.setItem(k, JSON.stringify(v));
  const toArr = o => Object.entries(o||{}).map(([k,v]) => ({...v, _id:k}));
  DB = {
    async getTraps(){ return Object.values(L('traps')).sort((a,b)=>a.code.localeCompare(b.code)); },
    async getTrap(c){ return L('traps')[c] || null; },
    async saveTrap(t){ const o=L('traps'); o[t.code]=t; S('traps',o); },
    async deleteTrap(c){ const o=L('traps'); delete o[c]; S('traps',o); const r=L('readings'); delete r[c]; S('readings',r); },
    async getReadings(c){ return toArr(L('readings')[c]).sort((a,b)=>b.ts-a.ts); },
    async addReading(c,r){ const o=L('readings'); o[c]=o[c]||{}; o[c]['r'+Date.now()+Math.random().toString(36).slice(2,6)]=r; S('readings',o); },
    async addReadingKey(c,id,r){ const o=L('readings'); o[c]=o[c]||{}; o[c][id]=r; S('readings',o); },
    async deleteReading(c,id){ const o=L('readings'); if(o[c]) delete o[c][id]; S('readings',o); },
    async isAdmin(){ return true; },
    async allReadings(){ const o=L('readings'); let out=[]; for(const c in o) toArr(o[c]).forEach(r=>out.push({...r,code:c})); return out; },
    async getLists(){ return normLists(L('lists')); },
    async saveList(k,arr){ const o=L('lists'); o[k]=arr; S('lists',o); }
  };
}

/* ===================== أدوات ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanCode = s => String(s).trim().toUpperCase().replace(/[.#$\[\]\/\s]+/g,'-');
const fmtDate = ts => new Date(ts).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});
const fmtISO = ts => ts ? new Date(ts - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16).replace('T',' ') : '';
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2200); }
function baseUrl(){ return localStorage.getItem('baseUrl') || (location.origin + location.pathname); }
const withTO = (p,ms,fb) => Promise.race([p, new Promise(r=>setTimeout(()=>r(fb),ms))]);
function b64e(o){ const bytes=new TextEncoder().encode(JSON.stringify(o)); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=String(s).replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))); }
const embedOn = () => localStorage.getItem('embedQR') !== '0';
/* رابط الـ QR: كود المصيدة + (اختيارياً) بياناتها الأساسية للعرض بدون إنترنت */
function trapUrl(t){
  const code = typeof t==='string' ? t : t.code;
  let u = baseUrl() + '?trap=' + encodeURIComponent(code);
  if(typeof t!=='string' && embedOn()){
    const o={}; if(t.name) o.n=t.name; if(t.type) o.y=t.type; if(t.location) o.l=t.location; if(t.installDate) o.d=t.installDate;
    if(Object.keys(o).length) u += '&i=' + b64e(o);
  }
  return u;
}
/* قراءات بانتظار الإرسال (للعمل بدون إنترنت) */
const pendingList = () => { try{ return JSON.parse(localStorage.getItem('pending')||'[]'); }catch(e){ return []; } };
const setPending = a => localStorage.setItem('pending', JSON.stringify(a));
function addPending(code,reading){ const a=pendingList(); a.push({id:'q'+Date.now()+Math.random().toString(36).slice(2,6), code, reading}); setPending(a); }
let flushing=false;
async function flushPending(){
  if(flushing || !navigator.onLine) return 0;
  if(auth && !CUR) return 0;
  flushing=true; let sent=0;
  try{
    for(const it of pendingList()){
      const r = await withTO(DB.addReadingKey(it.code,it.id,it.reading).then(()=>'ok').catch(e=>String(e&&(e.code||e.message)).includes('PERMISSION_DENIED')?'drop':'err'),10000,'err');
      if(r==='ok'||r==='drop'){ setPending(pendingList().filter(x=>x.id!==it.id)); if(r==='ok') sent++; } else break;
    }
  } finally { flushing=false; }
  return sent;
}
/* قراءة الإحداثيات بمرونة: أرقام عربية، فاصلة عشرية عربية، أو الاثنين في خانة واحدة */
function normDigits(s){ return String(s ?? '').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫،]/g,'.').replace(/[−–—]/g,'-'); }
function numsIn(v){
  let s = normDigits(v).trim();
  if(!s || /[°'"′″NSEWnsew]/.test(s)) return [];
  if(s.includes('.') && s.includes(',')) s = s.replace(/,/g,' '); else s = s.replace(/(\d),(\d)/g,'$1.$2');
  return (s.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
}
function parseXY(la,lo){
  const a=numsIn(la), b=numsIn(lo); let lat,lng;
  if(a.length>=2 && !b.length){ lat=a[0]; lng=a[1]; }
  else if(a.length && b.length){ lat=a[0]; lng=b[0]; }
  else return null;
  if(!(Math.abs(lat)<=90 && Math.abs(lng)<=180) || (lat===0 && lng===0)) return null;
  return {lat,lng};
}
const xy = t => parseXY(t.lat,t.lng);
const norm = t => { const p=xy(t); return p ? {...t,lat:p.lat,lng:p.lng} : t; };
function mapUrl(t){ const p=xy(t); return p ? `https://www.google.com/maps?q=${p.lat},${p.lng}` : ''; }
const STATUS = {normal:['طبيعي','bg-green-100 text-green-800'], low:['إصابة منخفضة','bg-yellow-100 text-yellow-800'], high:['إصابة مرتفعة','bg-red-100 text-red-800']};
const uniq = a => [...new Set(a.filter(Boolean))];

function makeQR(el, text, size=220){
  el.innerHTML=''; new QRCode(el,{text,width:size,height:size,correctLevel:text.length>160?QRCode.CorrectLevel.L:QRCode.CorrectLevel.M});
}
function qrDataUrl(text,size=400){
  return new Promise(res=>{ const d=document.createElement('div'); new QRCode(d,{text,width:size,height:size,correctLevel:text.length>160?QRCode.CorrectLevel.L:QRCode.CorrectLevel.M});
    setTimeout(()=>{ const c=d.querySelector('canvas'); res(c?c.toDataURL('image/png'):d.querySelector('img').src); },80); });
}
function downloadFile(name, content, type){ const a=document.createElement('a'); a.href = content.startsWith('data:')?content:URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); }

/* قوائم الاختيار الموحدة */
let LISTS = normLists(null);
function listSelect(id,key,val,allowNew=true){
  const arr=[...LISTS[key]]; if(val && !arr.includes(val)) arr.push(val);
  return `<select id="${id}" class="inp" data-list="${key}" data-new="${allowNew?1:0}"><option value="">— اختر —</option>${arr.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('')}${allowNew?'<option value="__new__">➕ إضافة قيمة جديدة…</option>':''}</select>`;
}
function bindListSelects(root){
  root.querySelectorAll('select[data-list]').forEach(sel=>{
    let prev = sel.value;
    sel.onchange = async () => {
      if(sel.value!=='__new__'){ prev=sel.value; return; }
      const k = sel.dataset.list;
      const v = (prompt('اكتب القيمة الجديدة — '+LIST_TITLES[k])||'').trim();
      if(!v){ sel.value=prev; return; }
      if(!LISTS[k].includes(v)){
        LISTS[k]=[...LISTS[k],v]; await DB.saveList(k,LISTS[k]);
        const o=document.createElement('option'); o.value=v; o.textContent=v; sel.insertBefore(o, sel.lastElementChild);
        toast('تمت إضافة القيمة للقائمة');
      }
      sel.value=v; prev=v;
    };
  });
}

const params = new URLSearchParams(location.search);
const trapParam = params.get('trap');

/* شعار PTS */
function logoSvg(size=48){
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="PTS">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14532d"/><stop offset="1" stop-color="#22a35a"/></linearGradient></defs>
    <rect width="64" height="64" rx="15" fill="url(#lg)"/>
    <g fill="#fff">
      <rect x="9" y="9" width="17" height="17" rx="3"/><rect x="38" y="9" width="17" height="17" rx="3"/><rect x="9" y="38" width="17" height="17" rx="3"/>
      <rect x="30" y="9" width="4" height="4"/><rect x="30" y="17" width="4" height="4"/><rect x="9" y="30" width="4" height="4"/><rect x="17" y="30" width="4" height="4"/>
      <rect x="30" y="30" width="4" height="4"/><rect x="38" y="30" width="4" height="4"/><rect x="46" y="30" width="4" height="4"/><rect x="30" y="38" width="4" height="4"/><rect x="30" y="46" width="4" height="4"/>
    </g>
    <g fill="#166534"><rect x="12.5" y="12.5" width="10" height="10" rx="1.5"/><rect x="41.5" y="12.5" width="10" height="10" rx="1.5"/><rect x="12.5" y="41.5" width="10" height="10" rx="1.5"/></g>
    <g fill="#fff"><rect x="15.5" y="15.5" width="4" height="4" rx="1"/><rect x="44.5" y="15.5" width="4" height="4" rx="1"/><rect x="15.5" y="44.5" width="4" height="4" rx="1"/></g>
    <path d="M40 55 C39 44 47 38 57 40 C58 49 51 57 40 55 Z" fill="#fff"/>

  </svg>`;
}
(function(){ const l=document.createElement('link'); l.rel='icon'; l.href='data:image/svg+xml,'+encodeURIComponent(logoSvg(64)); document.head.appendChild(l); })();

      ${pendingList().length?`<span class="text-xs px-2 py-1 rounded bg-amber-100 text-amber-800">⏳ ${pendingList().length} قراءة بانتظار الإرسال</span>`:''}
      ${CUR?`<span class="text-xs px-2 py-1 rounded ${IS_ADMIN?'bg-purple-100 text-purple-800':'bg-sky-100 text-sky-800'}">${IS_ADMIN?'مدير':'مشرف'}</span>`:''}
      ${CUR?`<button onclick="auth.signOut()" class="text-xs px-2 py-1 rounded bg-slate-200">خروج (${esc(CUR.email)})</button>`:''}

/* ===================== صفحة المصيدة (بعد السكان) ===================== */
async function renderTrap(code){
  const app=$('#app'); app.innerHTML = header() + '<p>جاري التحميل...</p>';
  const readJSON = (k,d) => { try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return v ?? d; }catch(e){ return d; } };
  LISTS = (await withTO(DB.getLists().catch(()=>null),3500,null)) || readJSON('lc',null) || normLists(null);
  try{ localStorage.setItem('lc', JSON.stringify(LISTS)); }catch(e){}
  let t = await withTO(DB.getTrap(code).catch(()=>undefined),4500,undefined);
  const live = t !== undefined;
  let src = 'live';
  if(live){ if(t){ try{ localStorage.setItem('ct_'+code, JSON.stringify(t)); }catch(e){} } }
  else {
    t = readJSON('ct_'+code,null); src = 'cache';
    if(!t){
      src = 'qr';
      try{ const o=b64d(params.get('i')||''); t={code, name:o.n||'', type:o.y||'', location:o.l||'', installDate:o.d||''}; }
      catch(e){ t={code, name:'', type:'', location:'', installDate:''}; }
    }
  }
  if(!t){ app.innerHTML = header()+`<div class="bg-white p-6 rounded-xl">المصيدة <b>${esc(code)}</b> غير موجودة. <a class="text-green-700 underline" href="${location.pathname}">لوحة التحكم</a></div>`; return; }
  let readings = live ? await withTO(DB.getReadings(code).catch(()=>null),5000,null) : null;
  if(readings){ try{ localStorage.setItem('cr_'+code, JSON.stringify(readings.slice(0,60))); }catch(e){} }
  else readings = readJSON('cr_'+code,[]);
  const pend = pendingList().filter(p=>p.code===code).map(p=>({...p.reading,_id:p.id,_pending:true}));
  readings = [...pend,...readings].sort((a,b)=>b.ts-a.ts);
  const counts = readings.map(r=>+r.count||0);
  const total = counts.reduce((a,b)=>a+b,0);
  const avg = counts.length ? (total/counts.length).toFixed(1) : 0;
  const last12 = readings.slice(0,12).reverse();
  const max = Math.max(1,...last12.map(r=>+r.count||0));
  const now = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);

  app.innerHTML = header() + `

        <td>${IS_ADMIN&&live&&!r._pending?`<button class="text-red-600 text-xs" data-del="${esc(r._id)}">حذف</button>`:''}</td></tr>`).join('')
        :'<tr><td colspan="7" class="p-4 text-center text-slate-400">لا توجد قراءات بعد</td></tr>'}</tbody></table>
  </div>`;

  bindLogin(); bindListSelects(app);
  if($('#setLoc')) $('#setLoc').onclick = () => {

    toast('جاري تحديد الموقع...');
    navigator.geolocation.getCurrentPosition(async p => {
      const today = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
      await DB.saveTrap({...t, lat:p.coords.latitude.toFixed(6), lng:p.coords.longitude.toFixed(6), installDate:t.installDate||today});
      toast('تم تثبيت الموقع ✅'); renderTrap(code);
    }, ()=>toast('تعذر تحديد الموقع'), {enableHighAccuracy:true});

  if($('#rf')) $('#rf').onsubmit = async e => {
    e.preventDefault();
    const insp = $('#r_inspector').value.trim(); localStorage.setItem('inspector', insp);
    addPending(code,{ ts:new Date($('#r_date').value).getTime(), count:+$('#r_count').value, species:$('#r_species').value,
      status:$('#r_status').value, inspector:insp, notes:$('#r_notes').value.trim() });
    if(navigator.onLine){ toast('جاري الحفظ...'); const n = await flushPending(); toast(n?'تم حفظ القراءة ✅':'⏳ تم الحفظ على الجهاز وستُرسل تلقائياً'); }
    else toast('📴 لا يوجد إنترنت — تم الحفظ على جهازك وستُرسل تلقائياً');

  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(confirm('حذف هذه القراءة؟')){ await DB.deleteReading(code,b.dataset.del); renderTrap(code);} });

let LAST = {}; try{ LAST = JSON.parse(localStorage.getItem('lastTrap')||'{}'); }catch(e){}
let CUR_TRAPS = [];
const SEL = new Set();
const F = {q:'', type:'', loc:''};
let PSIZE = 'm';

async function renderAdmin(){
  const app=$('#app');

  if(auth && !IS_ADMIN){ app.innerHTML = header('') + `<div class="bg-white rounded-xl shadow p-5 text-center max-w-md mx-auto my-6">

    <button id="xlsx" class="btn bg-emerald-700 text-sm mr-auto">⬇️ تنزيل كل البيانات (Excel)</button>

      <div id="m_url" class="text-xs break-all text-slate-400 mb-3" dir="ltr"></div>
      <div class="flex gap-2"><button id="m_dl" class="btn bg-green-700 flex-1 text-sm">تحميل PNG</button>
      <button id="m_pr" class="btn bg-slate-700 flex-1 text-sm">طباعة</button>
      <button id="m_x" class="btn bg-slate-400 text-sm">إغلاق</button></div>

/* ---------- تبويب المصائد ---------- */
function tabTraps(){
  const traps = CUR_TRAPS;
  $('#tabBody').innerHTML = `
  <form id="tf" class="bg-white rounded-xl shadow p-4 mb-4 grid grid-cols-1 md:grid-cols-3 gap-3">
    <div class="md:col-span-3 font-semibold">${editing?'✏️ تعديل مصيدة':'➕ إضافة مصيدة جديدة'}</div>
    <label class="text-sm">كود المصيدة<input id="t_code" class="inp" placeholder="يُولَّد تلقائياً" ${editing?'readonly':''}></label>
    <label class="text-sm">اسم المصيدة<span id="w_name"></span></label>
    <label class="text-sm">النوع<span id="w_type"></span></label>
    <label class="text-sm md:col-span-2">الموقع<span id="w_loc"></span></label>
    <label class="text-sm">تاريخ التركيب<input type="date" id="t_install" class="inp"></label>
    <label class="text-sm">خط العرض<input id="t_lat" class="inp" dir="ltr"></label>
    <label class="text-sm">خط الطول<input id="t_lng" class="inp" dir="ltr"></label>
    <div class="flex items-end"><button type="button" id="gps" class="btn bg-blue-600 w-full">📍 موقعي الحالي</button></div>
    <label class="text-sm md:col-span-3">ملاحظات<input id="t_notes" class="inp"></label>
    <div class="md:col-span-3 flex gap-2">
      <button class="btn bg-green-700 flex-1">${editing?'حفظ التعديل':'إضافة المصيدة'}</button>
      ${editing?'<button type="button" id="cancel" class="btn bg-slate-500">إلغاء</button>':''}
    </div>
  </form>

  <div class="bg-white rounded-xl shadow p-4 mb-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-3">
      <input id="f_q" class="inp" placeholder="🔎 بحث بالكود أو الاسم" value="${esc(F.q)}">
      <select id="f_type" class="inp"><option value="">كل الأنواع</option>${uniq([...LISTS.types,...traps.map(t=>t.type)]).map(x=>`<option ${F.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select id="f_loc" class="inp"><option value="">كل المواقع</option>${uniq([...LISTS.locations,...traps.map(t=>t.location)]).map(x=>`<option ${F.loc===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <div class="flex gap-2">
        <select id="psize" class="inp"><option value="s" ${PSIZE==='s'?'selected':''}>ملصق صغير</option><option value="m" ${PSIZE==='m'?'selected':''}>ملصق متوسط</option><option value="l" ${PSIZE==='l'?'selected':''}>ملصق كبير</option></select>
        <button id="printSel" class="btn bg-slate-700 text-sm whitespace-nowrap">🖨️ طباعة المحدد (<span id="selCount">0</span>)</button>
      </div>
    </div>
    <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-500 text-right border-b">
      <th class="p-2 w-8"><input type="checkbox" id="chkAll"></th><th>الكود</th><th>الاسم</th><th>الموقع</th><th>النوع</th><th>التركيب</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    <div id="rowsInfo" class="text-xs text-slate-500 mt-2"></div>
  </div>

  <div class="bg-white rounded-xl shadow p-4">
    <label class="text-sm font-semibold">رابط التطبيق (الذي سيُشفَّر داخل الـ QR)
      <input id="base" class="inp mt-1" dir="ltr" value="${esc(baseUrl())}"></label>
    <div class="text-xs text-slate-500 mt-1">عند وجود إنترنت تُقرأ البيانات حيّة من القاعدة.</div>
    <label class="flex items-start gap-2 mt-3 text-sm"><input type="checkbox" id="embedChk" class="mt-1" ${embedOn()?'checked':''}>
      <span><b>تضمين البيانات الأساسية داخل الـ QR</b> (الاسم، النوع، الموقع، تاريخ التركيب) ليظهر كود وبيانات المصيدة حتى بدون إنترنت.
      <span class="block text-xs text-slate-500">يجعل الـ QR أكثر كثافة، فاستخدم ملصقاً متوسطاً أو كبيراً. أعد طباعة الأكواد بعد تغيير هذا الخيار أو تعديل بيانات المصيدة.</span></span></label>
  </div>`;

  $('#w_name').innerHTML = listSelect('t_name','names','');
  $('#w_type').innerHTML = listSelect('t_type','types','');
  $('#w_loc').innerHTML  = listSelect('t_location','locations','');

  if(editing){
    const t = traps.find(x=>x.code===editing);
    if(t){
      $('#t_code').value=t.code;
      $('#w_name').innerHTML = listSelect('t_name','names',t.name||'');
      $('#w_type').innerHTML = listSelect('t_type','types',t.type||'');
      $('#w_loc').innerHTML  = listSelect('t_location','locations',t.location||'');
      $('#t_lat').value=t.lat||''; $('#t_lng').value=t.lng||''; $('#t_notes').value=t.notes||''; $('#t_install').value=t.installDate||'';
    }
  } else {
    const n = traps.reduce((m,t)=>{ const x=/(\d+)$/.exec(t.code); return x?Math.max(m,+x[1]):m; },0)+1;
    $('#t_code').value = 'TRP-'+String(n).padStart(4,'0');
    // الاحتفاظ بآخر إدخال
    $('#w_name').innerHTML = listSelect('t_name','names',LAST.name||'');
    $('#w_type').innerHTML = listSelect('t_type','types',LAST.type||'');
    $('#w_loc').innerHTML  = listSelect('t_location','locations',LAST.location||'');
    $('#t_notes').value = LAST.notes||''; $('#t_install').value = LAST.installDate||'';
  }
  bindListSelects($('#tf'));

  $('#gps').onclick = () => navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(p=>{ $('#t_lat').value=p.coords.latitude.toFixed(6); $('#t_lng').value=p.coords.longitude.toFixed(6); toast('تم تحديد الموقع'); },
        ()=>toast('تعذر تحديد الموقع'), {enableHighAccuracy:true})
    : toast('المتصفح لا يدعم GPS');

  $('#tf').onsubmit = async e => {
    e.preventDefault();
    const code = cleanCode($('#t_code').value);
    const name = $('#t_name').value;
    if(!code) return toast('الكود مطلوب');
    if(!name || name==='__new__') return toast('اختر اسم المصيدة من القائمة');
    const rawLa=$('#t_lat').value.trim(), rawLo=$('#t_lng').value.trim(); let latS='', lngS='';
    if(rawLa||rawLo){
      const p=parseXY(rawLa,rawLo);
      if(!p) return toast('الإحداثيات غير صالحة — اكتب خط العرض والطول كأرقام (مثال: 27.2579 و 33.8116)');
      latS=p.lat.toFixed(6); lngS=p.lng.toFixed(6);
    }
    if(!editing && await DB.getTrap(code)) return toast('هذا الكود مستخدم بالفعل');
    const old = editing ? await DB.getTrap(code) : null;
    const rec = { code, name, type:$('#t_type').value, location:$('#t_location').value,
      lat:latS, lng:lngS, notes:$('#t_notes').value.trim(),
      installDate:$('#t_install').value, createdAt: old?.createdAt || Date.now() };
    await DB.saveTrap(rec);
    if(!editing){
      LAST = {name:rec.name, type:rec.type, location:rec.location, notes:rec.notes, installDate:rec.installDate};
      try{ localStorage.setItem('lastTrap', JSON.stringify(LAST)); }catch(e){}
    }
    editing=null; toast('تم حفظ '+code+' ✅'); renderAdmin();
  };
  if(editing) $('#cancel').onclick=()=>{ editing=null; renderAdmin(); };
  $('#base').onchange = e => { localStorage.setItem('baseUrl', e.target.value.trim()); toast('تم حفظ الرابط'); };
  $('#embedChk').onchange = e => { localStorage.setItem('embedQR', e.target.checked?'1':'0'); toast(e.target.checked?'سيتم تضمين البيانات في الـ QR':'الـ QR سيحمل الكود فقط'); };

  $('#f_q').oninput = e => { F.q=e.target.value; drawRows(); };
  $('#f_type').onchange = e => { F.type=e.target.value; drawRows(); };
  $('#f_loc').onchange = e => { F.loc=e.target.value; drawRows(); };
  $('#psize').onchange = e => { PSIZE=e.target.value; };
  $('#printSel').onclick = () => printLabels(CUR_TRAPS.filter(t=>SEL.has(t.code)), PSIZE);
  $('#chkAll').onchange = e => { visibleTraps().forEach(t=> e.target.checked ? SEL.add(t.code) : SEL.delete(t.code)); drawRows(); };

  $('#m_x').onclick=()=>{ const m=$('#modal'); m.classList.add('hidden'); m.classList.remove('flex'); };
  drawRows();
}

function visibleTraps(){
  const q = F.q.trim().toLowerCase();
  return CUR_TRAPS.filter(t => (!F.type||t.type===F.type) && (!F.loc||t.location===F.loc) &&
    (!q || (t.code+' '+(t.name||'')).toLowerCase().includes(q)));
}
function updSel(){
  const el=$('#selCount'); if(el) el.textContent = SEL.size;
  const vis = visibleTraps(); const all=$('#chkAll');
  if(all) all.checked = vis.length>0 && vis.every(t=>SEL.has(t.code));
}
function drawRows(){
  const vis = visibleTraps();
  $('#rows').innerHTML = vis.length ? vis.map(t=>`<tr class="border-b">
    <td class="p-2"><input type="checkbox" data-sel="${esc(t.code)}" ${SEL.has(t.code)?'checked':''}></td>
    <td class="font-bold text-green-800">${esc(t.code)}</td><td>${esc(t.name)}</td><td>${esc(t.location||'')}</td><td>${esc(t.type||'')}</td>
    <td class="text-xs whitespace-nowrap">${t.installDate?esc(t.installDate):'—'} ${hasXY(t)?'<span title="تم تحديد الموقع">📍</span>':'<span title="بدون موقع أو إحداثيات غير صالحة">⚠️</span>'}</td>
    <td class="whitespace-nowrap space-x-2 space-x-reverse">
      <button class="text-green-700" data-qr="${esc(t.code)}">QR</button>
      <a class="text-blue-700" href="?trap=${encodeURIComponent(t.code)}">فتح</a>
      <button class="text-amber-700" data-edit="${esc(t.code)}">تعديل</button>
      <button class="text-red-600" data-rm="${esc(t.code)}">حذف</button></td></tr>`).join('')
    : '<tr><td colspan="7" class="p-4 text-center text-slate-400">لا توجد مصائد مطابقة</td></tr>';
  $('#rowsInfo').textContent = `المعروض ${vis.length} من ${CUR_TRAPS.length} مصيدة`;
  document.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{ c.checked?SEL.add(c.dataset.sel):SEL.delete(c.dataset.sel); updSel(); });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ editing=b.dataset.edit; tabTraps(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{ if(confirm('حذف المصيدة وكل قراءاتها؟')){ await DB.deleteTrap(b.dataset.rm); SEL.delete(b.dataset.rm); renderAdmin(); } });
  document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>showQR(CUR_TRAPS.find(t=>t.code===b.dataset.qr)));
  updSel();
}

function showQR(t){
  const m=$('#modal'); m.classList.remove('hidden'); m.classList.add('flex');
  $('#m_title').textContent=t.code; $('#m_sub').textContent=t.name+(t.location?' — '+t.location:'');

  $('#m_x').onclick=()=>{ m.classList.add('hidden'); m.classList.remove('flex'); };

}

/* ---------- طباعة الملصقات (QR + الكود تحته) ---------- */
const PSIZES = { s:{qr:110, cols:5}, m:{qr:150, cols:4}, l:{qr:200, cols:3} };
function printLabels(list, size='m'){
  if(!list.length) return toast('حدد مصيدة واحدة على الأقل');
  const {qr,cols} = PSIZES[size] || PSIZES.m;
  const pa=$('#printArea'); pa.innerHTML=''; pa.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  list.forEach(t=>{
    const d=document.createElement('div'); d.className='label';
    d.innerHTML = `<div class="q"></div>
      <div style="font-weight:bold;font-size:${qr>=130?16:12}px;margin-top:3px;letter-spacing:.5px">${esc(t.code)}</div>
      <div style="font-size:${qr>=130?11:9}px">${esc(t.name||'')}</div>
      <div style="font-size:${qr>=130?10:8}px;color:#444">${esc(t.location||'')}</div>`;
    pa.appendChild(d); makeQR(d.querySelector('.q'), trapUrl(t), qr);
  });
  setTimeout(()=>window.print(), 250 + list.length*15);
}

function mapStats(){
  const {traps,readings}=MAPDATA;
  const from = MF.from ? new Date(MF.from+'T00:00:00').getTime() : -Infinity;
  const to   = MF.to   ? new Date(MF.to+'T23:59:59').getTime() : Infinity;
  const sel = traps.filter(t=>(!MF.trap||t.code===MF.trap)&&(!MF.type||t.type===MF.type)&&(!MF.loc||t.location===MF.loc)).map(norm);
  const by={}; readings.forEach(r=>{ if(r.ts>=from && r.ts<=to) (by[r.code]=by[r.code]||[]).push(r); });
  return sel.map(t=>{
    const rs=by[t.code]||[]; const total=rs.reduce((a,r)=>a+(+r.count||0),0);
    return {t, n:rs.length, total, avg: rs.length?total/rs.length:0, last: rs.length?Math.max(...rs.map(r=>r.ts)):0};
  });
}

function updateHeat(fit){
  if(!map) return;
  const stats = mapStats();
  const w = s => MF.metric==='avg' ? s.avg : s.total;
  const withXY = stats.filter(s=>hasXY(s.t));
  const maxW = Math.max(0,...withXY.map(w));
  if(heatLayer) map.removeLayer(heatLayer);
  if(markerLayer) map.removeLayer(markerLayer);
  const pts = withXY.filter(s=>w(s)>0).map(s=>[+s.t.lat,+s.t.lng,w(s)]);
  heatLayer = L.heatLayer(pts,{radius:40,blur:30,maxZoom:17,max:maxW||1,
    gradient:{0.2:'#2c7bb6',0.4:'#abd9e9',0.6:'#ffffbf',0.8:'#fdae61',1:'#d7191c'}}).addTo(map);
  markerLayer = L.layerGroup(withXY.map(s=>L.circleMarker([+s.t.lat,+s.t.lng],{radius:6,color:'#111',weight:1,fillColor:'#fff',fillOpacity:.9})
    .bindPopup(`<div dir="rtl"><b>${esc(s.t.code)}</b> — ${esc(s.t.name||'')}<br>النوع: ${esc(s.t.type||'—')}<br>الموقع: ${esc(s.t.location||'—')}<br>عدد القراءات: ${s.n}<br>الإجمالي: ${s.total}<br>المتوسط: ${s.avg.toFixed(1)}</div>`))).addTo(map);
  if(fit && withXY.length){ map.fitBounds(L.latLngBounds(withXY.map(s=>[+s.t.lat,+s.t.lng])),{padding:[50,50],maxZoom:16}); }
  setTimeout(()=>map.invalidateSize(),50);
  const noXY = stats.length - withXY.length;
  $('#mapInfo').textContent = `المصائد المعروضة: ${withXY.length} من ${stats.length}` + (noXY?` — ${noXY} بدون إحداثيات (غير ظاهرة على الخريطة)`:'') + ` — المقياس: ${MF.metric==='avg'?'متوسط القراءة':'إجمالي الأعداد'}`;
  $('#mapRows').innerHTML = [...stats].sort((a,b)=>w(b)-w(a)).map(s=>`<tr class="border-b">
    <td class="p-2 font-bold text-green-800">${esc(s.t.code)}</td><td>${esc(s.t.name||'')}</td><td>${esc(s.t.type||'')}</td><td>${esc(s.t.location||'')}</td>
    <td>${s.n}</td><td class="font-bold">${s.total}</td><td>${s.avg.toFixed(1)}</td><td>${s.last?fmtDate(s.last):'—'}</td></tr>`).join('')
    || '<tr><td colspan="8" class="p-4 text-center text-slate-400">لا توجد بيانات</td></tr>';
}

/* فحص وإصلاح الإحداثيات المخزّنة */
async function fixCoords(){
  const box=$('#p_fixres'); box.classList.remove('hidden'); box.textContent='جاري الفحص...';
  const fixed=[], bad=[], odd=[];
  for(const t of CUR_TRAPS){
    const rl=String(t.lat??'').trim(), rg=String(t.lng??'').trim();
    if(!rl && !rg) continue;
    let p=parseXY(rl,rg), swapped=false;
    if(!p){
      const la=numsIn(rl)[0], lo=numsIn(rg)[0];
      if(la!==undefined && lo!==undefined && Math.abs(la)>90 && Math.abs(la)<=180 && Math.abs(lo)<=90){ p={lat:lo,lng:la}; swapped=true; }
    }
    if(!p){ bad.push(t); continue; }
    const clean = /^-?\d+(\.\d+)?$/.test(rl) && /^-?\d+(\.\d+)?$/.test(rg);
    if(swapped || !clean){
      const {_id,...rest}=t;
      await DB.saveTrap({...rest, lat:p.lat.toFixed(6), lng:p.lng.toFixed(6)});
      fixed.push(t.code+(swapped?' (كانت معكوسة)':''));
    }
    if(p.lat<21.5||p.lat>32||p.lng<24.5||p.lng>37) odd.push(t.code+` (${p.lat.toFixed(4)}, ${p.lng.toFixed(4)})`);
  }
  CUR_TRAPS = await DB.getTraps();
  CUR_TRAPS.filter(hasXY).forEach(t=>{ PV.known.add(t.code); PV.sel.add(t.code); });
  drawPinList(); updatePins(true);
  const lines=[];
  if(fixed.length) lines.push(`✅ تم إصلاح صيغة ${fixed.length} مصيدة: ${esc(fixed.join('، '))}`);
  if(bad.length) lines.push(`❌ إحداثيات غير صالحة (عدّلها يدوياً من زر "تعديل"): ${bad.map(t=>`<b>${esc(t.code)}</b> (<span dir="ltr">${esc(t.lat)} | ${esc(t.lng)}</span>)`).join('، ')}`);
  if(odd.length) lines.push(`🧭 خارج نطاق مصر، راجع إن كانت معكوسة أو خاطئة: <span dir="ltr">${esc(odd.join(' ، '))}</span>`);
  box.innerHTML = lines.length ? lines.map(l=>`<div class="mb-1">${l}</div>`).join('') : '✅ كل الإحداثيات سليمة.';
}

/* رسم الخريطة على Canvas (دبابيس + أكواد) لاستخدامها في PDF والطباعة */
function mercator(lat,lng,z){
  const s=256*Math.pow(2,z), la=Math.max(-85,Math.min(85,lat))*Math.PI/180;
  return {x:(lng+180)/360*s, y:(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*s};
}
const loadTile = (z,x,y) => new Promise(res=>{ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=`https://tile.openstreetmap.org/${z}/${x}/${y}.png`; });
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

async function renderMapCanvas(list,W,H){
  const c=document.createElement('canvas'); c.width=W; c.height=H; const ctx=c.getContext('2d');
  const padX=170, padY=140; let z=17;
  for(; z>1; z--){
    const p=list.map(t=>mercator(+t.lat,+t.lng,z));
    const w=Math.max(...p.map(a=>a.x))-Math.min(...p.map(a=>a.x)), h=Math.max(...p.map(a=>a.y))-Math.min(...p.map(a=>a.y));
    if(w<=W-2*padX && h<=H-2*padY) break;
  }
  const pts=list.map(t=>mercator(+t.lat,+t.lng,z));
  const cx=(Math.min(...pts.map(a=>a.x))+Math.max(...pts.map(a=>a.x)))/2, cy=(Math.min(...pts.map(a=>a.y))+Math.max(...pts.map(a=>a.y)))/2;
  const left=cx-W/2, top=cy-H/2;
  ctx.fillStyle='#e5e7eb'; ctx.fillRect(0,0,W,H);
  const n=Math.pow(2,z), jobs=[];
  for(let ty=Math.floor(top/256); ty<=Math.floor((top+H)/256); ty++){
    if(ty<0||ty>=n) continue;
    for(let tx=Math.floor(left/256); tx<=Math.floor((left+W)/256); tx++){
      const wx=((tx%n)+n)%n;
      jobs.push(loadTile(z,wx,ty).then(im=>{ if(im) ctx.drawImage(im,tx*256-left,ty*256-top,256,256); }));
    }
  }
  await Promise.all(jobs);

  ctx.direction='ltr'; ctx.textAlign='left'; ctx.textBaseline='middle';
  const xy=pts.map(p=>({x:p.x-left,y:p.y-top}));
  const placed=xy.map(p=>({x:p.x-16,y:p.y-42,w:32,h:44}));
  const hit=(a,b)=>!(a.x+a.w<b.x||b.x+b.w<a.x||a.y+a.h<b.y||b.y+b.h<a.y);
  // الدبابيس
  xy.forEach(p=>{
    const r=11, cc={x:p.x,y:p.y-26}, al=Math.acos(r/26);
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
    ctx.lineTo(cc.x+r*Math.cos(Math.PI/2-al), cc.y+r*Math.sin(Math.PI/2-al));
    ctx.arc(cc.x,cc.y,r,Math.PI/2-al,Math.PI/2+al,true); ctx.closePath();
    ctx.fillStyle='#dc2626'; ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.beginPath(); ctx.arc(cc.x,cc.y,4.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  });
  // الأكواد
  ctx.font='bold 24px Tahoma, Arial';
  list.forEach((t,i)=>{
    const p=xy[i], w=ctx.measureText(t.code).width+18, h=34;
    const cands=[{x:p.x+16,y:p.y-46},{x:p.x-16-w,y:p.y-46},{x:p.x-w/2,y:p.y-46-h-4},{x:p.x-w/2,y:p.y+6}];
    let pick=cands.find(o=>!placed.some(r=>hit({x:o.x,y:o.y,w,h},r))) || cands[0];
    placed.push({x:pick.x,y:pick.y,w,h});
    rrect(ctx,pick.x,pick.y,w,h,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#166534'; ctx.stroke();
    ctx.fillStyle='#14532d'; ctx.fillText(t.code,pick.x+9,pick.y+h/2+1);
  });
  ctx.font='18px Arial'; const at='© OpenStreetMap contributors', aw=ctx.measureText(at).width+14;
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(W-aw,H-28,aw,28); ctx.fillStyle='#333'; ctx.fillText(at,W-aw+7,H-13);
  ctx.strokeStyle='#14532d'; ctx.lineWidth=3; ctx.strokeRect(1.5,1.5,W-3,H-3);
  return c;
}

/* صفحات التقرير A4 (خريطة + جدول) */
function buildReportPages(list,mapCanvas){
  const W=1240,H=1754,M=60,pages=[], RH=44;
  const dateTxt=new Date().toLocaleDateString('ar-EG',{dateStyle:'long'});
  const cols=[['الكود',150],['الاسم',250],['الموقع',250],['النوع',150],['تاريخ التركيب',150],['الإحداثيات',170]];
  const newPage=()=>{ const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.direction='rtl'; x.textBaseline='middle'; pages.push(c); return x; };
  const cell=(ctx,txt,edge,wd,y)=>{ ctx.save(); ctx.beginPath(); ctx.rect(edge-wd,y,wd,RH); ctx.clip(); ctx.textAlign='right'; ctx.fillText(String(txt??''),edge-10,y+RH/2+1); ctx.restore(); };
  const head=(ctx,y)=>{ ctx.fillStyle='#14532d'; ctx.fillRect(M,y,W-2*M,RH); ctx.fillStyle='#fff'; ctx.font='bold 20px Tahoma, Arial';
    let e=W-M; cols.forEach(([l,w])=>{ cell(ctx,l,e,w,y); e-=w; }); };
  let ctx=newPage();
  // ترويسة الصفحة الأولى
  rrect(ctx,M,48,130,72,14); ctx.fillStyle='#14532d'; ctx.fill();
  ctx.direction='ltr'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 40px Arial'; ctx.fillText('PTS',M+65,85); ctx.direction='rtl';
  ctx.textAlign='right'; ctx.fillStyle='#14532d'; ctx.font='bold 44px Tahoma, Arial'; ctx.fillText('خريطة مواقع المصائد',W-M,78);
  ctx.fillStyle='#475569'; ctx.font='22px Tahoma, Arial'; ctx.fillText('PTS — نظام مصائد الآفات',W-M,120);
  ctx.font='21px Tahoma, Arial'; ctx.fillText(`التاريخ: ${dateTxt}   |   عدد المصائد: ${list.length}`,W-M,152);
  ctx.drawImage(mapCanvas,M,185,W-2*M,Math.round((W-2*M)*mapCanvas.height/mapCanvas.width));
  let y=185+Math.round((W-2*M)*mapCanvas.height/mapCanvas.width)+30;
  head(ctx,y); y+=RH;
  list.forEach((t,i)=>{
    if(y+RH>H-90){ ctx=newPage(); y=70; head(ctx,y); y+=RH; }
    if(i%2===0){ ctx.fillStyle='#f1f5f0'; ctx.fillRect(M,y,W-2*M,RH); }
    ctx.strokeStyle='#d1d5db'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(M,y+RH); ctx.lineTo(W-M,y+RH); ctx.stroke();
    ctx.fillStyle='#111';
    const vals=[t.code,t.name,t.location,t.type,t.installDate||'—',`${(+t.lat).toFixed(5)}, ${(+t.lng).toFixed(5)}`];
    let e=W-M; vals.forEach((v,k)=>{ ctx.font = k===0?'bold 20px Tahoma, Arial':(k===5?'16px Arial':'19px Tahoma, Arial'); cell(ctx,v,e,cols[k][1],y); e-=cols[k][1]; });
    y+=RH;
  });
  pages.forEach((c,i)=>{ const x=c.getContext('2d'); x.direction='rtl'; x.textAlign='center'; x.fillStyle='#64748b'; x.font='17px Tahoma, Arial';
    x.fillText('م. محمد عبد الجواد — مدير قطاع مكافحة الآفات — 01000754632',W/2,H-48);
    x.fillText(`صفحة ${i+1} من ${pages.length}`,W/2,H-24); });
  return pages;
}

async function exportPins(mode){
  if(pBusy) return;
  const list = shownPins();
  if(!list.length) return toast('حدد مصائد لها موقع أولاً');
  pBusy=true; toast('جاري تجهيز الخريطة... (قد تستغرق بضع ثوانٍ)');
  try{
    const mc = await renderMapCanvas(list,1680,1200);
    const pages = buildReportPages(list,mc);
    if(mode==='pdf'){
      const {jsPDF} = window.jspdf; const pdf = new jsPDF({unit:'mm',format:'a4',orientation:'p'});
      pages.forEach((c,i)=>{ if(i) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297); });
      pdf.save('PTS-traps-map-'+new Date().toISOString().slice(0,10)+'.pdf'); toast('تم حفظ ملف PDF ✅');
    } else {
      const pa=$('#printArea'); pa.innerHTML=''; pa.style.gridTemplateColumns='1fr';
      pages.forEach(c=>{ const im=new Image(); im.className='pimg'; im.src=c.toDataURL('image/jpeg',0.92); pa.appendChild(im); });
      setTimeout(()=>window.print(),400);
    }
  }catch(e){ console.error(e); toast('تعذر تجهيز الخريطة'); }
  pBusy=false;
}

/* ---------- تنزيل كل البيانات Excel ---------- */
async function exportXLSX(){
  const traps = await DB.getTraps(); const rs = await DB.allReadings();
  const tm = Object.fromEntries(traps.map(t=>[t.code,t]));
  const sheetTraps = traps.map(t=>({'كود المصيدة':t.code,'الاسم':t.name||'','النوع':t.type||'','الموقع':t.location||'','خط العرض':t.lat||'','خط الطول':t.lng||'','ملاحظات':t.notes||'','تاريخ التركيب':t.installDate||'','تاريخ الإضافة':fmtISO(t.createdAt)}));
  rs.sort((a,b)=>a.code.localeCompare(b.code)||a.ts-b.ts);
  const sheetReads = rs.map(r=>{ const t=tm[r.code]||{}; return {
    'كود المصيدة':r.code,'الاسم':t.name||'','النوع':t.type||'','الموقع':t.location||'','خط العرض':t.lat||'','خط الطول':t.lng||'',
    'التاريخ':fmtISO(r.ts),'العدد':+r.count||0,'نوع الحشرة':r.species||'','الحالة':(STATUS[r.status]||STATUS.normal)[0],'المفتش':r.inspector||'','ملاحظات':r.notes||''}; });
  const sheetSum = traps.map(t=>{ const x=rs.filter(r=>r.code===t.code); const total=x.reduce((a,r)=>a+(+r.count||0),0);
    return {'كود المصيدة':t.code,'الاسم':t.name||'','النوع':t.type||'','الموقع':t.location||'','تاريخ التركيب':t.installDate||'','عدد القراءات':x.length,'إجمالي الحشرات':total,'المتوسط':x.length?+(total/x.length).toFixed(2):0,'آخر قراءة':x.length?fmtISO(Math.max(...x.map(r=>r.ts))):''}; });
  const wb = XLSX.utils.book_new();
  const add = (rows,name,empty) => { const ws = XLSX.utils.json_to_sheet(rows.length?rows:[empty]); ws['!cols']=Object.keys(rows[0]||empty).map(()=>({wch:18})); XLSX.utils.book_append_sheet(wb,ws,name); };
  add(sheetReads,'القراءات',{'لا توجد قراءات':''});
  add(sheetSum,'ملخص المصائد',{'لا توجد مصائد':''});
  add(sheetTraps,'المصائد',{'لا توجد مصائد':''});
  wb.Workbook = {Views:[{RTL:true}]};
  XLSX.writeFile(wb, 'traps-data-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('تم تنزيل ملف Excel');
}

/* ===================== تشغيل ===================== */
function route(){ trapParam ? renderTrap(cleanCode(trapParam)) : renderAdmin(); }
if(auth){
  auth.onAuthStateChanged(async u => {
    CUR=u; IS_ADMIN=false;
    if(u){
      const r = await withTO(DB.isAdmin(u.uid),3500,null);
      if(r===null) IS_ADMIN = localStorage.getItem('adm_'+u.uid)==='1';
      else { IS_ADMIN=r; try{ localStorage.setItem('adm_'+u.uid, r?'1':'0'); }catch(e){} }
    }
    route();
    flushPending().then(n=>{ if(n){ toast(`تم إرسال ${n} قراءة ✅`); route(); } });
  });
} else { IS_ADMIN = true; route(); flushPending(); }
window.addEventListener('online', async () => {
  const n = await flushPending();
  if(n){ toast(`تم إرسال ${n} قراءة ✅`); if(trapParam) renderTrap(cleanCode(trapParam)); }
});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
